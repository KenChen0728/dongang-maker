<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黑鮪魚名牌吊飾</title>
<meta name="description" content="打上名字，做成黑鮪魚造型的 3D 雙色吊飾。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: a maker's bench. Home = a wall of tools grouped by machine; maker page = drawing sheet on the left, "what the machine will make" + options + download on the right; stacks into 3 steps on phones. */
:root{
  color-scheme:dark;
  --bg:#171b16; --grid:rgba(214,226,190,.045); --panel:#1f241d; --surface:#262c24; --surface-2:#2f362c; --line:#3b4337; --line-2:#4c5646;
  --ink:#ece7da; --muted:#a6a894; --faint:#7d806f;
  --accent:#e2803d; --accent-ink:#1d1006; --accent-soft:#3b2a1c; --accent-line:#8d5228;
  --leaf:#8fb36a; --leaf-soft:#26321e;
  --wood:#cfa874; --wood-2:#b98f5a; --burn:#4b2c13; --cut:#ff6248; --score:#6f9bff; --fil:#ece6da; --fil2:#e2803d; --clay:#c98a69;
  --warn-bg:#3a3120; --warn-ink:#f2d690; --info-bg:#22302a; --info-ink:#bfe0cd; --bad:#ff8a73;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -14px rgba(0,0,0,.6);
  --f-display:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px; --tap:44px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#e6dccb; --grid:rgba(90,70,40,.07); --panel:#efe7d9; --surface:#f6f1e7; --surface-2:#ebe2d2; --line:#d2c3a8; --line-2:#bba98b;
  --ink:#2a271f; --muted:#6c634f; --faint:#958a72;
  --accent:#b5561c; --accent-ink:#fff8f0; --accent-soft:#f1dcc6; --accent-line:#d99a6c;
  --leaf:#4f7a2c; --leaf-soft:#dde6cd;
  --wood:#d6b27f; --wood-2:#bf9660; --burn:#4b2c13; --cut:#d8361f; --score:#2f5fd6; --fil:#f4efe4; --fil2:#d0672a; --clay:#d99a78;
  --warn-bg:#f6e6bd; --warn-ink:#5d4300; --info-bg:#e1eadb; --info-ink:#2d4a36; --bad:#b8321a;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 24px -16px rgba(80,60,30,.45);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e6dccb; --grid:rgba(90,70,40,.07); --panel:#efe7d9; --surface:#f6f1e7; --surface-2:#ebe2d2; --line:#d2c3a8; --line-2:#bba98b;
  --ink:#2a271f; --muted:#6c634f; --faint:#958a72;
  --accent:#b5561c; --accent-ink:#fff8f0; --accent-soft:#f1dcc6; --accent-line:#d99a6c;
  --leaf:#4f7a2c; --leaf-soft:#dde6cd;
  --wood:#d6b27f; --wood-2:#bf9660; --burn:#4b2c13; --cut:#d8361f; --score:#2f5fd6; --fil:#f4efe4; --fil2:#d0672a; --clay:#d99a78;
  --warn-bg:#f6e6bd; --warn-ink:#5d4300; --info-bg:#e1eadb; --info-ink:#2d4a36; --bad:#b8321a;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 24px -16px rgba(80,60,30,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:1280px;margin:0 auto}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto;text-decoration:none;color:inherit;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:12px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:9px;min-height:34px;font-weight:500;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2) inset}
.seg.accent button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin:8px 0 18px}
.hero h1{font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.25}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.ruler{height:14px;border-bottom:1px solid var(--line-2);background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 10px) bottom/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 50px) bottom/100% 12px no-repeat;opacity:.8;margin:6px 0 18px}
.machines{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.machines{grid-template-columns:minmax(0,1fr)}}
.machine{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.machine>header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.machine>header h2{font-size:1.15rem}
.machine>header span{color:var(--muted);font-size:.85rem}
.tag3d,.taglaser{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag3d{background:var(--accent-soft);color:var(--accent)}
.taglaser{background:var(--leaf-soft);color:var(--leaf)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 8px 10px;min-width:0;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.card canvas{width:100%;aspect-ratio:16/11;max-width:100%;border-radius:8px;background:var(--surface-2);display:block}
.card b{font-family:var(--f-display);font-size:1.02rem;margin-top:8px;line-height:1.3}
.card span.d{font-size:.8rem;color:var(--muted);line-height:1.4;margin-top:2px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card .meta i{font-style:normal;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.pin{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);color:var(--faint);display:grid;place-items:center}
.pin[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.more{margin-top:18px}
.more>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.more[open]>summary::before{transform:rotate(45deg)}
.teach{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.box h3{font-size:1rem;margin-bottom:8px}
.box p,.box li{color:var(--muted);font-size:.9rem}
.box ul,.box ol{margin:0;padding-left:1.2em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- maker ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px 6px 8px;min-height:40px;color:var(--ink)}
.title{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto}
.title h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px}
.steps button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;min-height:36px;color:var(--muted)}
.steps button b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-family:var(--f-mono);font-size:.8rem;color:var(--ink)}
.steps button[aria-current="step"]{color:var(--ink);border-color:var(--accent)}
.steps button[aria-current="step"] b{background:var(--accent);color:var(--accent-ink)}
.maker{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:980px){
  .maker{grid-template-columns:minmax(0,1fr)}
  .maker[data-step="1"] .p2,.maker[data-step="1"] .p3,.maker[data-step="2"] .p1,.maker[data-step="2"] .p3,.maker[data-step="3"] .p1,.maker[data-step="3"] .p2{display:none}
  .steps button span{display:none}
  .steps button{padding:4px}
}
@media (min-width:981px){.nextbtn{display:none!important}}
@media (max-width:700px){
  .bar{position:static;background:none}
  .bar .seg,.bar .iconbtn{display:none}
  .machine>header{flex-wrap:wrap;row-gap:2px}
  .machine>header .tag3d,.machine>header .taglaser{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.pane>h2{font-size:1rem;display:flex;align-items:center;gap:8px}
.pane>h2 b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.78rem}

/* tools */
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:56px;min-height:56px;padding:6px 6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.76rem;line-height:1.1}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool:disabled{opacity:.4;cursor:not-allowed}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hist{display:flex;gap:4px;margin-left:auto}
.hist .btn{min-height:38px;padding:5px 10px;font-size:.85rem}
.subtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:40px}
.subtools .lbl{color:var(--muted);font-size:.85rem}
.pens{display:flex;gap:4px}
.pens button{display:grid;place-items:center;width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pens button i{display:block;border-radius:50%;background:var(--ink)}
.pens button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stage{position:relative;width:100%;display:flex;justify-content:center;background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);border-radius:12px;padding:10px;border:1px solid var(--line)}
canvas.sheet{display:block;max-width:100%;max-height:max(340px,min(calc(100vh - 300px),640px));width:auto;height:auto;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.35);touch-action:none;cursor:crosshair}
.stage.select canvas.sheet{cursor:default}
.selbar,.photobar,.confirm,.draft{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:8px}
.selbar .lbl,.photobar .lbl{font-size:.85rem;color:var(--muted);margin-right:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;min-height:38px;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{min-height:52px;font-size:1.05rem;padding:10px 18px;border-radius:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.tips{font-size:.88rem;color:var(--muted);margin:0}
.nextbtn{align-self:flex-end}

/* preview */
.viewtabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.preview{position:relative;width:100%;aspect-ratio:4/3;max-height:58vh;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface-2),var(--panel) 75%);border:1px solid var(--line)}
.preview>*{position:absolute;inset:0;width:100%;height:100%}
.preview svg{padding:10px}
.preview canvas.gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.preview #flat svg{width:100%;height:100%;display:block}
.preview .empty{display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:.95rem}
.preview .busy{position:absolute;inset:auto 10px 10px auto;width:auto;height:auto;font-size:.78rem;color:var(--muted);background:var(--panel);border-radius:8px;padding:2px 8px;border:1px solid var(--line)}
.preview .hint{position:absolute;inset:auto auto 10px 10px;width:auto;height:auto;font-size:.75rem;color:var(--faint);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:0 0 0 1px var(--line-2) inset}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.fact small{display:block;color:var(--muted);font-size:.72rem}
.fact b{font-family:var(--f-mono);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.fact.good b{color:var(--leaf)} .fact.bad b{color:var(--bad)}
.msg{border-radius:10px;padding:8px 12px;font-size:.88rem;margin:0}
.msg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.msg.info{background:var(--info-bg);color:var(--info-ink)}

/* options */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;flex-direction:column;gap:6px;min-width:0}
.opt>label,.opt>.l{font-size:.88rem;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.opt>label.switch{justify-content:flex-start;font-weight:400;font-size:.92rem}
.opt output{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.opt small{color:var(--faint);font-size:.76rem;line-height:1.4}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.switch{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.switch input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(18px);background:var(--accent)}
details.grp{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}
details.grp>summary{cursor:pointer;font-weight:500;font-size:.92rem}
details.grp[open]>summary{margin-bottom:10px}
details.grp .opts{gap:10px}

/* download */
.seats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seats button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:1.05rem;font-weight:600;color:var(--ink)}
.seats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.field input,.field textarea,.field select{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
.status{font-size:.88rem;color:var(--muted);min-height:1.4em;margin:0}
.status.ok{color:var(--leaf)} .status.err{color:var(--bad)}
.notes ol,.notes ul{margin:4px 0 0;padding-left:1.25em;color:var(--muted);font-size:.88rem}
.notes h3{font-size:.95rem;margin-top:8px}

/* sheets (in-page dialogs) */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,9,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet-dlg{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.7)}
.sheet-dlg h2{font-size:1.1rem}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.stk-grid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;color:#2a271f;font-size:.72rem}
.stk-grid canvas{width:52px;height:52px}
.fontpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fontpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-size:1.15rem;line-height:1.2;color:var(--ink)}
.fontpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
textarea#textIn{font-size:1.4rem;min-height:84px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px)}

/* kid mode: bigger targets */
:root[data-mode="kid"] .tool{min-width:60px;min-height:60px;font-size:.82rem}
:root[data-mode="kid"] .tool svg{width:28px;height:28px}

/* ===== machine & material calibration (saved on this device, shareable as a short code) ===== */
const MACHINE = (() => {
  const DEF = { matT: 3.0, slotW: 3.05, kerf: .10, clr: .25, hole: .20, stick: 3.0, pencil: 7.5, dowel: 20, magD: 10, magT: 3 };
  const KEY = "lw2:machine";
  let cur = Object.assign({}, DEF);
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) for (const k in DEF) if (typeof s[k] === "number" && isFinite(s[k])) cur[k] = s[k]; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cur)); } catch (e) {} };
  const r2 = v => Math.round(v * 100) / 100;
  /* code: matT*10 . slotW*100 . kerf*100 . clr*100 . hole*100 . stick*10 . pencil*10 . magD . magT . dowel */
  function code() { return [Math.round(cur.matT * 10), Math.round(cur.slotW * 100), Math.round(cur.kerf * 100), Math.round(cur.clr * 100), Math.round(cur.hole * 100), Math.round(cur.stick * 10), Math.round(cur.pencil * 10), cur.magD, cur.magT, cur.dowel].join("."); }
  function parse(s) {
    const a = String(s || "").trim().replace(/[^\d.]/g, "").split(".").map(Number); if (a.length < 5 || a.some(v => !isFinite(v))) return null;
    const o = { matT: a[0] / 10, slotW: a[1] / 100, kerf: a[2] / 100, clr: a[3] / 100, hole: a[4] / 100 };
    if (a.length >= 7) { o.stick = a[5] / 10; o.pencil = a[6] / 10; }
    if (a.length >= 9) { o.magD = a[7]; o.magT = a[8]; }
    if (a.length >= 10) o.dowel = a[9];
    const ok = o.matT >= 1 && o.matT <= 8 && o.slotW >= .8 && o.slotW <= 9 && o.kerf >= 0 && o.kerf <= .5 && o.clr >= 0 && o.clr <= 1 && o.hole >= -.5 && o.hole <= 1;
    return ok ? o : null;
  }
  return {
    DEF, get: () => cur, set(k, v) { cur[k] = r2(v); save(); }, setAll(o) { for (const k in o) if (k in DEF) cur[k] = o[k]; save(); }, reset() { cur = Object.assign({}, DEF); save(); },
    code, parse,
    /* derived sizes */
    laserSlot: () => cur.slotW,                                  // cross-lap slot width for the plywood in use
    laserPress: d => r2(d - cur.kerf - .05),                     // hole a rod is pushed into and stays
    laserSpin: d => r2(d + .45 - cur.kerf),                      // hole a rod turns freely in
    printPress: d => r2(d + cur.hole),                           // printed hole a rod is pushed into
    printSpin: d => r2(d + cur.hole + .35),                      // printed hole a rod turns in
    printSlide: d => r2(d + cur.hole + 2 * cur.clr),             // printed hole a printed pin moves in
    printSlot: t => r2(t + 2 * cur.clr),                         // printed slot for a printed plate
    summary() { return `雷切：板厚 ${cur.matT}、插槽 ${cur.slotW}、切縫 ${cur.kerf}　3D：孔徑補償 ${cur.hole}、間隙 ${cur.clr}　材料：竹籤 ${cur.stick}、鉛筆 ${cur.pencil}、磁鐵 ${cur.magD}×${cur.magT}、木棒 ${cur.dowel}（mm）`; }
  };
})();

/* ===== product engines =====

    outs: ["3d", "laser"],

      seg("orient", "長方形要", [["h", "橫的"], ["v", "直的"]], "h", { when: p => p.frame === "rect" }),
      rng("size", "大小", 30, 90, 5, 45, "mm", { kid: true, presets: [[35, "小"], [45, "中"], [60, "大"]] }),
      chk("loop", "加掛環", true, { kid: true }),
      seg("hang", "掛環位置", [["-90", "左邊"], ["-45", "左上"], ["0", "正上"], ["45", "右上"], ["90", "右邊"], ["180", "下面"]], "0", { when: p => p.loop }),

    params: [
