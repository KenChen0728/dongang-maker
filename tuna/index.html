<style>
/* 黑鮪魚名牌吊飾：給 7–12 歲的小朋友用。深海藍是版頭，橘色只給主要動作和目前選到的東西，按鈕都是 64px 起跳。
   電腦上一個畫面看完三個步驟；手機和矮的畫面一次一步，主要按鈕固定在下面。 */
:root{
  color-scheme:dark;--cs:dark;
  --bg:#171b16;--grid:rgba(214,226,190,.045);--panel:#1f241d;--surface:#262c24;--surface-2:#2f362c;--line:#3b4337;--line-2:#5a6653;
  --ink:#ece7da;--muted:#bcbea9;
  --accent:#e2803d;--accent-ink:#1d1006;--accent-soft:#3b2a1c;--accent-line:#8d5228;
  --leaf:#9cc174;--leaf-soft:#26321e;--focus:#8ab4ff;--pick:#2f6f9f;--pick-ink:#fff;
  --warn-bg:#3a3120;--warn-ink:#f2d690;--info-bg:#22302a;--info-ink:#bfe0cd;--bad:#ff8a73;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -14px rgba(0,0,0,.6);
  --brand:#16324a;--edge:#e2803d;
  --font:"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --tap:4rem;--r:12px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;--cs:light;
  --bg:#e6dccb;--grid:rgba(90,70,40,.07);--panel:#efe7d9;--surface:#f6f1e7;--surface-2:#ebe2d2;--line:#d2c3a8;--line-2:#9c8a6c;
  --ink:#2a271f;--muted:#584f3e;
  --accent:#b5561c;--accent-ink:#fff8f0;--accent-soft:#f1dcc6;--accent-line:#d99a6c;
  --leaf:#3f6a22;--leaf-soft:#dde6cd;--focus:#1f5fc4;--pick:#1f5f8b;--pick-ink:#fff;
  --warn-bg:#f6e6bd;--warn-ink:#5d4300;--info-bg:#e1eadb;--info-ink:#2d4a36;--bad:#b8321a;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 24px -16px rgba(80,60,30,.45);
}}
:root[data-theme="light"]{
  color-scheme:light;--cs:light;
  --bg:#e6dccb;--grid:rgba(90,70,40,.07);--panel:#efe7d9;--surface:#f6f1e7;--surface-2:#ebe2d2;--line:#d2c3a8;--line-2:#9c8a6c;
  --ink:#2a271f;--muted:#584f3e;
  --accent:#b5561c;--accent-ink:#fff8f0;--accent-soft:#f1dcc6;--accent-line:#d99a6c;
  --leaf:#3f6a22;--leaf-soft:#dde6cd;--focus:#1f5fc4;--pick:#1f5f8b;--pick-ink:#fff;
  --warn-bg:#f6e6bd;--warn-ink:#5d4300;--info-bg:#e1eadb;--info-ink:#2d4a36;--bad:#b8321a;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 24px -16px rgba(80,60,30,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;font-size:16px}
@media (min-width:1700px) and (min-height:950px){html{font-size:18px}}
@media (min-width:2300px) and (min-height:1300px){html{font-size:20px}}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 1rem/1.5 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:800;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}

/* iPhone 上下邊：做法和排球記錄表相同，都是實機確認過的。
   主畫面 App 有兩種狀況：一、從狀態列後面開始畫（上 inset 大於 0），系統蓋模糊，內容要排到模糊下方，高度要用 100lvh 才到螢幕底；
   二、從狀態列下方開始（上 inset 0），沒有模糊，這時 100lvh 不準，要用 100dvh。下面的 min() 兩種都對。 */
:root{--safe-top:env(safe-area-inset-top,0px);--vgap:0px}
.statusband{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
.footband{display:none}
html{touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none}
button,label,.bar,.nav,summary{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
@media (display-mode:standalone){
  :root{--safe-top:calc(env(safe-area-inset-top,0px) + min(40px,calc(env(safe-area-inset-top,0px)*99)))}
  html{background:var(--brand);color-scheme:dark}
  body{color-scheme:var(--cs,light)}
  .statusband{height:max(6px,var(--safe-top))}
  .statusband::after,.footband::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--edge)}
  .statusband::after{bottom:0}
  .footband::before{top:0}
}
@media (display-mode:standalone) and (orientation:portrait){
  .footband{display:block;position:fixed;left:0;right:0;bottom:calc(0px - var(--vgap));height:env(safe-area-inset-bottom,0px);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){.statusband{display:none}}
@supports (height:100lvh){
  @media (display-mode:standalone){
    :root{--app-h:min(100lvh,calc(100dvh + env(safe-area-inset-top,0px)*99));--vgap:calc(var(--app-h) - 100dvh)}
    html,body,#app{height:var(--app-h)}
    html,body{overflow:visible}
    #app{overflow:hidden}
    .help,.scrim{bottom:calc(0px - var(--vgap))!important}
  }
}
button:active:not(:disabled){filter:brightness(.92)}

/* 版頭 */
.bar{background:var(--brand);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:max(8px,calc(var(--safe-top) + 6px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:64px}
.bar :focus-visible{outline-color:#fff}
.brandfish{flex:none;display:block;width:40px;height:26px;color:var(--edge)}
.bar h1{font-size:1.25rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sub{color:#cfdbe6;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.barbtn{flex:none;min-height:48px;min-width:48px;padding:0 12px;border-radius:12px;background:transparent;border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:700}
.bar h1+.sub+.barbtn{margin-left:auto}
.steps{display:none;gap:8px}
.inapp{order:10;flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff3cd;color:#3d2e00;border-radius:10px;padding:6px 12px;font-weight:700}
.inapp .barbtn{color:#3d2e00;border-color:#3d2e00}
.steps button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:4px 6px;border-radius:12px;background:rgba(255,255,255,.1);border:2px solid transparent;color:#fff;font-weight:700}
.steps button b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);font-family:var(--mono);font-size:1rem}
.steps button[aria-current="step"]{background:var(--edge);color:#1d1006}
.steps button[aria-current="step"] b{background:#1d1006;color:#fff}

/* 內容 */
.page{min-height:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.tuna-grid{max-width:1240px;height:100%;max-height:58rem;margin:0 auto;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"o p" "d p";gap:12px 16px}
.tuna-opts{grid-area:o;overflow:auto}.tuna-prev{grid-area:p;min-height:0}.tuna-dl{grid-area:d}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.pane>h2{font-size:1.125rem;display:flex;align-items:center;gap:8px;flex:none}
.pane>h2 b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pick);color:var(--pick-ink);font-family:var(--mono);font-size:1rem}
.tips{color:var(--muted);font-size:1rem;line-height:1.4}
.fontnote{color:var(--warn-ink);background:var(--warn-bg);border-radius:10px;padding:6px 12px}
.opt{display:flex;flex-direction:column;gap:4px;min-width:0}
.opt>.l{font-weight:700}
.tuna-name{width:100%;min-height:var(--tap);flex:none;font-size:1.75rem;font-weight:700;line-height:1.2;padding:8px 16px;border-radius:12px;border:3px solid var(--accent);background:var(--surface);color:var(--ink)}
.tuna-name::placeholder{color:var(--muted);opacity:1}
.seg{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.seg button{flex:1 1 0;min-width:4.25rem;min-height:var(--tap);padding:6px 10px;border:2px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1.0625rem;font-weight:600;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink);font-weight:800}
.seg.colors button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:5.5rem;white-space:nowrap}
.sw2{flex:none;display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2)}
details.more{flex:none;border:2px solid var(--line-2);border-radius:12px;background:var(--surface)}
details.more>summary{min-height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;cursor:pointer;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:10px;height:10px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary small{color:var(--muted);font-size:1rem;font-weight:400;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.more>div{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.switch{display:flex;align-items:center;gap:12px;min-height:var(--tap);font-size:1.0625rem;font-weight:600;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:60px;height:36px;margin:0;border-radius:999px;background:var(--surface-2);border:2px solid var(--line-2);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked{background:var(--pick);border-color:var(--pick)}
.switch input:checked::after{transform:translateX(24px);background:#fff}
.mini{display:none}

/* 預覽 */
.tuna-prev{display:flex;flex-direction:column}
.viewtabs{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.viewtabs .seg:first-child{flex:1 1 10rem}.viewtabs .seg.colors{flex:3 1 25rem}
.preview{position:relative;flex:1 1 0;min-height:200px;width:100%;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface-2),var(--panel) 75%);border:1px solid var(--line)}
.preview>*{position:absolute;inset:0;width:100%;height:100%}
.preview svg{padding:10px;width:100%;height:100%;display:block}
.preview canvas.gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.preview .empty{display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.preview .busy,.preview .clarity{inset:auto auto 8px 8px;width:auto;height:auto;font-size:1rem;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;pointer-events:none}
.preview .busy{inset:auto 8px 8px auto;color:var(--muted);font-weight:400}
.preview .clarity.good{color:var(--leaf)}.preview .clarity.mid{color:var(--warn-ink)}.preview .clarity.bad{color:var(--bad)}
.preview .pvreset{inset:8px 8px auto auto;width:auto;height:auto;min-height:48px;min-width:64px;padding:0 12px;color:var(--ink);background:var(--panel);border:2px solid var(--line-2);border-radius:12px;font-weight:600}

/* 下載 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:8px 16px;border:2px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1.0625rem;font-weight:700;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.big{width:100%;font-size:1.25rem}
.btn.careful{background:var(--warn-bg);border-color:var(--warn-ink);color:var(--warn-ink)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{border-radius:10px;padding:8px 12px;font-size:1rem;line-height:1.4}
.msg p{margin:0 0 4px}.msg p:last-of-type{margin-bottom:0}
.msg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.msg.info{background:var(--info-bg);color:var(--info-ink)}
.msg.good{background:var(--leaf-soft);color:var(--ink)}
.msg.plain{background:var(--surface);color:var(--muted)}
.tuna-recs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.tuna-recs .btn{flex:1 1 12rem}
.status{font-size:1rem;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.status:empty{display:none}
.status.ok{color:var(--leaf)}.status.err{color:var(--bad)}
.foot{color:var(--muted);font-size:.875rem;line-height:1.4}

/* 下面固定的上一步、下一步（只有一次一步的畫面才有） */
.nav{display:none;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.nav .btn{flex:1 1 0;min-width:0}
.nav .btn.primary{flex:2 1 0}

/* 老師看 */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,12,9,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,var(--safe-top)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet-dlg{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.7)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-dlg h2{font-size:1.25rem}
.sheet-dlg h3{font-size:1rem;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.fact small{display:block;color:var(--muted);font-size:.9375rem;line-height:1.3}
.fact b{font-family:var(--mono);font-weight:700;font-size:1.0625rem;font-variant-numeric:tabular-nums}
.fact.good b{color:var(--leaf)}.fact.bad b{color:var(--bad)}.fact.mid b{color:var(--warn-ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block;box-shadow:0 0 0 1px var(--line-2) inset}
.devinfo{font-family:var(--mono);font-size:.875rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:1.0625rem;font-weight:700;max-width:calc(100% - 32px)}

/* 一次一步：手機、窄視窗 */
@media (max-width:699px),(max-height:560px){
  .bar{min-height:56px;padding-bottom:6px;gap:6px 8px}
  .bar .sub{display:none}
  .bar h1{font-size:1.125rem;flex:1 1 0}
  .brandfish{width:32px}
  .barbtn{padding:0 8px}
  .steps{display:flex;order:9;flex:1 1 100%}
  .nav{display:flex}
  .tuna-grid{display:block;height:100%;max-height:none}
  .pane{background:none;border:0;box-shadow:none;padding:0;height:100%}
  .pane>h2{display:none}
  .page[data-step="1"] .tuna-prev,.page[data-step="1"] .tuna-dl,.page[data-step="2"] .tuna-opts,.page[data-step="2"] .tuna-dl,.page[data-step="3"] .tuna-opts,.page[data-step="3"] .tuna-prev{display:none}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .tuna-opts{overflow:visible}
  .seg.colors button{min-width:0}
}
/* 高的手機：打名字時下面就看得到魚 */
@media (max-width:699px) and (min-height:760px){
  .mini{display:block;flex:1 1 0;min-height:0;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface-2),var(--panel) 75%);border:1px solid var(--line)}
  .mini svg{display:block;width:100%;height:100%;padding:8px}
}
@media (max-width:399px){.seg.colors button{flex-direction:column;gap:2px;padding:4px}.steps button{flex-direction:column;gap:0}.steps button b{width:24px;height:24px}}
@media (max-width:339px){.bar .brandfish{display:none}}
/* 確認要下載的是什麼：第 3 步也看得到魚 */
@media (max-width:699px) and (min-height:601px){
  .tuna-dl .mini{display:block;flex:1 1 0;min-height:0;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--surface-2),var(--panel) 75%);border:1px solid var(--line)}
  .tuna-dl .mini svg{display:block;width:100%;height:100%;padding:8px}
}
/* 手機橫放、放大 200%：版頭一行，上一步下一步放右邊，內容才有高度 */
@media (max-height:560px) and (min-width:560px){
  #app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .bar{grid-column:1/-1;flex-wrap:nowrap;min-height:48px;padding-top:max(4px,calc(var(--safe-top) + 2px));padding-bottom:4px}
  .bar h1{flex:none}
  .steps{order:0;flex:1 1 auto;margin:0 8px}
  .steps button{min-height:48px;flex-direction:row;flex:0 1 auto;padding:4px 10px}
  .steps button:not([aria-current]) span{display:none}
  .steps button[aria-current]{flex:1 1 auto}
  .barbtn{order:1;min-height:44px}
  .nav{flex-direction:column;width:148px;padding:8px max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) 8px;border-top:0;border-left:1px solid var(--line)}
